# Reverse proxy in front of the Go service. Only this container publishes a
# port to the host; the app is reachable inside the compose network only.
server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Docker's embedded DNS. Resolving through a variable lets nginx follow
    # the app container when it restarts with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://app:8080;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
